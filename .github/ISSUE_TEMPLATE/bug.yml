name: Bug
description: Báo lỗi có cách tái hiện
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi và kết quả thực tế
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Môi trường
      description: Hệ điều hành, JDK, nhánh/commit, dữ liệu mẫu; không gửi thông tin bí mật.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Ảnh hoặc log đã loại bỏ thông tin nhạy cảm
